            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/projects/{project_id}/resources/{resource_type}/{resource_id}:
    delete:
      tags:
      - Projects
      summary: Remove resource from project
      description: Detaches a resource from a project without deleting the resource
        itself.
      operationId: removeResourceFromProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: resource_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ProjectResourceTypeEnum'
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveResourceResponseDto'
        '403':
          description: Not authorized to modify this project.
        '404':
          description: Project or resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhooks:
    post:
      tags:
      - Webhooks
      summary: Create webhook
      description: Creates a new webhook endpoint for the organization. Webhooks can
        be typed (slack, teams, generic) and configured with delivery_mode (full or
        per_record), custom headers, query params, and auth. Max webhook limit is
        plan-dependent. Optionally pass project_id to associate the webhook with a
        project immediately upon creation.
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequestDto'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookResponseDto'
        '403':
          description: Project does not belong to the caller's organization.
        '404':
          description: project_id does not reference an existing project.
        '422':
          description: Plan limit reached or validation error.
        '401':
          description: Missing or invalid authentication credentials.
    get:
      tags:
      - Webhooks
      summary: List webhooks
      description: Returns a paginated list of webhooks belonging to the organization.
        Use page/page_size for pagination. Filter by name fragment with search. Use
        project_id to scope to a project.
      operationId: listWebhooks
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Page Size
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhooksResponseDto'
        '403':
          description: Project does not belong to the caller's organization.
        '404':
          description: project_id does not reference an existing project.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhooks/{webhook_id}:
    get:
      tags:
      - Webhooks
      summary: Get webhook
      description: Returns full configuration of a single webhook by ID.
      operationId: getWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWebhookResponseDto'
        '403':
          description: Webhook belongs to a different organization.
        '404':
          description: Webhook not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
    patch:
      tags:
      - Webhooks
      summary: Update webhook
      description: Partially updates a webhook's configuration. Only supplied fields
        are updated. Use is_active=false to disable delivery without deleting.
      operationId: updateWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookResponseDto'
        '403':
          description: Not authorized to update this webhook.
        '404':
          description: Webhook not found.
        '422':
          description: Validation error.
        '401':
          description: Missing or invalid authentication credentials.
    delete:
      tags:
      - Webhooks
      summary: Delete webhook
      description: Permanently deletes a webhook. All resource assignments are removed.
        Returns 204 No Content.
      operationId: deleteWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Not authorized to delete this webhook.
        '404':
          description: Webhook not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhooks/{webhook_id}/test:
    post:
      tags:
      - Webhooks
      summary: Test webhook delivery
      description: Sends a test HTTP request to the webhook URL and returns the response.
        Use this to verify URL reachability and auth before attaching to a live resource.
        Optionally supply a custom payload; otherwise a synthetic test payload is
        sent.
      operationId: testWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/TestWebhookRequestDto'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestWebhookResponseDto'
        '403':
          description: Not authorized to test this webhook.
        '404':
          description: Webhook not found.
        '422':
          description: Test delivery failed — check the response body for upstream
            status code and error.
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhooks/{webhook_id}/resources:
    post:
      tags:
      - Webhooks
      summary: Assign resource to webhook
      description: Attaches a job, event monitor, or event monitor group to a webhook so it receives
        delivery on completion. Returns 201 on new assignment, 200 if already assigned.
        A webhook can be assigned to multiple resources; each resource can have multiple
        webhooks (up to plan limit).
      operationId: assignWebhookResource
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignWebhookResourceRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignWebhookResourceResponseDto'
        '400':
          description: Webhook per-resource limit exceeded.
        '403':
          description: Not authorized.
        '404':
          description: Webhook or resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
    get:
      tags:
      - Webhooks
      summary: List webhook resources
      description: Returns a paginated list of resources (jobs, event monitors, event monitor groups)
        currently assigned to this webhook. Filter by resource_type.
      operationId: listWebhookResources
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MappableResourceType'
          - type: 'null'
          title: Resource Type
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhookResourcesResponseDto'
        '403':
          description: Not authorized.
        '404':
          description: Webhook not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhooks/{webhook_id}/resources/{resource_type}/{resource_id}:
    delete:
      tags:
      - Webhooks
      summary: Remove resource from webhook
      description: Detaches a specific resource from this webhook. Future job/event monitor
        runs will no longer trigger delivery to this webhook. Returns 204 No Content.
      operationId: removeWebhookResource
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      - name: resource_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MappableResourceType'
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '204':
          description: Successful Response
        '403':
          description: Not authorized.
        '404':
          description: Webhook not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/resources/{resource_type}/{resource_id}/webhooks:
    get:
      tags:
      - Webhooks
      summary: List webhooks for a resource
      description: Returns all webhooks currently assigned to the given resource (job,
        event monitor, or event monitor group). Use is_active filter to see only active or inactive
        webhooks.
      operationId: listWebhooksForResource
      parameters:
      - name: resource_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MappableResourceType'
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      - name: is_active
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWebhooksForResourceResponseDto'
        '403':
          description: Resource does not belong to your organization.
        '404':
          description: Resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhook-history:
    get:
      tags:
      - Webhooks
      summary: Get webhook delivery history
      description: Returns paginated webhook delivery events ordered by timestamp
        descending. Provide either `webhook_id` to fetch history for a specific webhook,
        or `resource_type` + `resource_id` to fetch history for a resource. Exactly
        one of these combinations must be supplied.
      operationId: getWebhookDeliveryHistory
      parameters:
      - name: webhook_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Webhook ID — mutually exclusive with resource_type/resource_id
          title: Webhook Id
        description: Webhook ID — mutually exclusive with resource_type/resource_id
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MappableResourceType'
          - type: 'null'
          description: 'Resource type: job, event monitor, event monitor group'
          title: Resource Type
        description: 'Resource type: job, event monitor, event monitor group'
      - name: resource_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: ID of the resource
          title: Resource Id
        description: ID of the resource
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/WebhookHistoryByWebhookDto'
                - $ref: '#/components/schemas/WebhookHistoryByResourceDto'
                title: Response Getwebhookdeliveryhistory
        '403':
          description: Not authorized to view this resource's history.
        '404':
          description: Resource not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/webhook/trigger/{resource_type}/{resource_id}:
    post:
      tags:
      - Webhooks
      summary: Manually trigger webhook delivery for a resource
      operationId: triggerWebhook
      parameters:
      - name: resource_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/MappableResourceType'
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      - name: webhook_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Webhook Id
      - name: job_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /health:
    get:
      tags:
      - Meta
      summary: Check health
      description: Check API availability.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: API is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                required:
                - healthy
  /version:
    get:
      tags:
      - Meta
      summary: Get version
      description: Returns current API version.
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Current API version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                required:
                - version
servers:
- url: https://catchall.newscatcherapi.com
  description: Production server
externalDocs:
  description: Find out more about NewsCatcher CatchAll API
  url: https://www.newscatcherapi.com/docs/web-search-api/get-started/introduction
tags:
- name: Jobs
  description: Operations to create, monitor, and retrieve job results.
  externalDocs:
    description: Learn about job lifecycle and status tracking
    url: https://www.newscatcherapi.com/docs/web-search-api/get-started/quickstart
- name: Event Monitors
  description: Operations to create, operate and retrieve event monitor results.
  externalDocs:
    description: Automate recurring queries with scheduled jobs and webhook notifications.
    url: https://www.newscatcherapi.com/docs/web-search-api/concepts/event-monitors
- name: Entities
  description: 'Operations to create, update, and delete company entities.


    Entities are the building blocks of Company Monitors. Each entity represents
    a company (or person) you want to track. Add identifying information such as domain,
    alternative names, and key persons to improve matching quality.'
  externalDocs:
    description: Learn about Company Monitors and entities
    url: https://www.newscatcherapi.com/docs/web-search-api/concepts/company-monitors
- name: Datasets
  description: 'Operations to create and manage datasets of entities.


    A dataset is a named collection of entities — think of it as a watchlist or portfolio.
    Connect a dataset to a job via `connected_dataset_ids` to activate Company Monitors.
    Datasets can be reused across multiple jobs and event monitors.'
  externalDocs:
    description: Learn about datasets and Company Monitors
    url: https://www.newscatcherapi.com/docs/web-search-api/concepts/company-monitors
- name: Projects
  description: 'Operations to create, organize, and manage projects.


    A project is a named container for jobs, event monitors, and datasets. Group related
    resources by use case, team, or client, and share them with teammates. Resources
    can be assigned at creation time or post-hoc.'
  externalDocs:
    description: Learn about projects and resource organization
    url: https://www.newscatcherapi.com/docs/web-search-api/concepts/projects
- name: Webhooks
  description: 'Operations to create, manage, and test webhooks.


    Webhooks deliver real-time notifications to your endpoint when event monitor jobs complete.
    Configure URL, authentication, headers, and delivery mode.'
  externalDocs:
    description: Learn about webhooks and notifications
    url: https://www.newscatcherapi.com/docs/web-search-api/guides-and-concepts/webhooks
- name: Meta
  description: Operations to check API health and version.
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CheckQueryQualityResponseDto:
      properties:
        status:
          $ref: '#/components/schemas/QueryStatus'
        title:
          type: string
          title: Title
          description: Brief assessment headline
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: 2-3 sentence assessment
        issues:
          anyOf:
          - items:
              $ref: '#/components/schemas/IssueType'
            type: array
          - type: 'null'
          title: Issues
        suggestions:
          anyOf:
          - items:
              $ref: '#/components/schemas/Suggestion'
            type: array
          - type: 'null'
          title: Suggestions
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: Confidence in assessment
      type: object
      required:
      - status
      - title
      - confidence
      title: CheckQueryQualityResponseDto
      description: Complete query validation result
    CheckQueryQualityRequestDto:
      properties:
        query:
          type: string
          title: Query
      type: object
      required:
      - query
      title: CheckQueryQualityRequestDto
    DatasetStatus:
      type: string
      enum:
      - pending
      - enriching
      - ready
      - failed
      title: DatasetStatus
      description: 'Processing status of a dataset: pending → enriching → ready. Failed
        indicates one or more entity enrichments failed.'
    SubmitResponseDto:
      properties:
        job_id:
          type: string
          format: uuid
          title: Job Id
          description: UUID of the created job. Use this in /status and /pull.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      type: object
      required:
      - job_id
      title: SubmitResponseDto
    GetWebhookResponseDto:
      properties:
        success:
          type: boolean
          title: Success
          description: True if the operation succeeded; false otherwise.
        message:
          type: string
          title: Message
          description: Human-readable result message.
        webhook:
          anyOf:
          - $ref: '#/components/schemas/WebhookResponseDto'
          - type: 'null'
          description: Webhook details.
      type: object
      required:
      - success
      - message
      title: GetWebhookResponseDto
    AddResourceRequestDto:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ResourceItemRequestDto'
          type: array
          title: Resources
          description: Resources to assign to the project.
      type: object
      required:
      - resources
      title: AddResourceRequestDto
    UpdateMonitorResponseDto:
      properties:
        monitor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Monitor Id
          description: Event monitor identifier.
        status:
          type: string
          title: Status
          description: Confirmation message.
          default: Monitor updated Successfully
      type: object
      title: UpdateMonitorResponseDto
    CreateEntitiesBatchResponseDto:
      properties:
        entities:
          items:
            $ref: '#/components/schemas/CreateEntityResponseDto'
          type: array
          title: Entities
          description: Array of created entity stubs in the same order as the input.
        count:
          type: integer
          title: Count
          description: Total number of entities created.
      type: object
      required:
      - entities
      - count
      title: CreateEntitiesBatchResponse
    UpdateMonitorRequestDto:
      properties:
        webhook_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Webhook Ids
          description: Optional list of centralized webhook IDs to assign to this
            event monitor. Empty list clears assignments.
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
          description: Optional max results per event monitor run (min 10, validated against
            plan)
      type: object
      title: UpdateMonitorRequestDto
    MappableResourceType:
      type: string
      enum:
      - job
      - monitor
      - monitor_group
      title: MappableResourceType
      description: 'Resource types that can be assigned to a webhook: job, event monitor,
        or event monitor group.'
    GetProjectResponseDto:
      properties:
        success:
          type: boolean
          title: Success
          description: True if the operation succeeded; false otherwise.
        message:
          type: string
          title: Message
          description: Human-readable result message.
        project_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
          description: Project identifier.
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Project name.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Project description.
        resources_count:
          type: integer
          title: Resources Count
          description: Number of resources assigned to this project.
          default: 0
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
          description: Project creation timestamp.
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
          description: Timestamp of the last update.
        sharing_info:
          anyOf:
          - $ref: '#/components/schemas/SharingInfoDto'
          - type: 'null'
          description: Present when this project was shared with the authenticated
            user.
      type: object
      required:
      - success
      - message
      title: GetProjectResponseDto
    DeleteMonitorResponseDto:
      properties:
        success:
          type: boolean
          title: Success
          description: True if the delete operation succeeded; false otherwise.
        message:
          type: string
          title: Message
          description: Human-readable result message.
        monitor_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Monitor Id
          description: ID of the deleted event monitor. Null on failure.
      type: object
      required:
      - success
      - message
      title: DeleteMonitorResponseDto
    RemoveResourceResponseDto:
      properties:
        success:
