      description: 'Canonical enrichment types: text, number, date, option, url, company.
        See Company enrichment docs for the company type data model.'
    WebhookDeliveryStatus:
      type: string
      enum:
      - SUCCESS
      - FAILED
      title: WebhookDeliveryStatus
      description: Webhook delivery outcome status.
    WebhookHistoryResourceType:
      type: string
      enum:
      - job
      - monitor
      - monitor_group
      - test
      title: WebhookHistoryResourceType
      description: 'Resource types a webhook_status row can be recorded against.


        A superset of MappableResourceType: real deliveries are always tied to an

        attachable resource (job/event monitor/event monitor group), but a manual test delivery

        (POST /webhooks/{id}/test) isn''t tied to any real resource, so it is recorded

        against the synthetic `test` type instead. Kept separate from

        MappableResourceType so `test` can never be accepted where an attachable

        resource type is expected (e.g. assigning a webhook to a resource).'
    ConnectedEntityDto:
