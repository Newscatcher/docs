          description: IANA timezone for the schedule (e.g. 'America/New_York'). Overridden
            if the schedule text itself contains a timezone.
          default: UTC
          example: America/New_York
        webhook_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Webhook Ids
          description: Webhook IDs to notify on each run completion. Max 5 per event monitor.
        limit:
          anyOf:
          - type: integer
            minimum: 10.0
