openapi: 3.1.0
info:
  title: NewsCatcher CatchAll API
  version: 1.8.1
  contact:
    name: NewsCatcher
    url: https://newscatcherapi.com
    email: support@newscatcherapi.com
  description: 'CatchAll is a web search API that generates unique datasets that don''t
    exist anywhere else on the web. Built on NewsCatcher''s proprietary real-world
    event index, it delivers state-of-the-art recall—finding all relevant events,
    not just top results.


    ### Authentication


    All endpoints except /health and /version require `x-api-key` header. If the key
    is invalid or missing, the API returns the `403 Forbidden` error.


    ### Job workflow


    1. (Optional) Get suggestions via /catchAll/initialize

    2. Submit a query via /catchAll/submit with optional date ranges and custom validators/enrichments

    3. Poll /catchAll/status/{job_id} until completed (10-15 minutes)

    4. Retrieve results via /catchAll/pull/{job_id}


    ### Event monitor workflow


    1. Create successful job via /catchAll/submit

    2. Create event monitor via /catchAll/monitors/create with schedule

    3. Retrieve aggregated results via /catchAll/monitors/pull/{monitor_id}


    ### Company search workflow


    1. Create a dataset via `POST /catchAll/datasets/` or `POST /catchAll/datasets/upload`

    2. Wait for the dataset `latest_status` to reach `ready`

    3. Submit a job with `connected_dataset_ids` pointing to your dataset

    4. Retrieve results — each record includes a `connected_entities` array with relevance
    scores per matched company


    ### Important notes


    **Dynamic schemas**: Response schemas are generated dynamically by LLMs. Field
    names in the `enrichment` object may vary and are not deterministic across jobs
    unless explicitly specified.'
paths:
  /catchAll/validate:
    post:
      tags:
      - Jobs
      summary: Check Query Quality
      description: 'Use this endpoint before submitting a job to validate that your
        query

        is well-formed and likely to produce good results.'
      operationId: validateQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckQueryQualityRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckQueryQualityResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/submit:
    post:
      tags:
      - Jobs
      summary: Create a new job
      description: 'Submits a natural-language query to the CatchAll pipeline and
        returns a `job_id` immediately. The job runs asynchronously.


        **Workflow:** submit → poll `/status/{job_id}` every 5 s → pull results from
        `/pull/{job_id}`.


        **Concurrency:** the `Jobs_Concurrency` plan entitlement limits simultaneous
        in-flight jobs. A 429 is returned if the limit is reached.'
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponseDto'
        '400':
          description: Validation error (invalid query, bad dates, empty validators
            list, etc.)
        '403':
          description: Invalid or missing API key, or unauthorized webhook/dataset
            access
        '404':
          description: Webhook ID or project not found
        '429':
          description: Concurrency limit reached
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Detailed documentation for job creation
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/create-job
  /catchAll/initialize:
    post:
      tags:
      - Jobs
      summary: Preview suggested validators and enrichments
      description: 'Dry-run endpoint that returns the validators and enrichments the
        API would auto-generate for a given query. Use this before `/submit` to decide
        which fields to pass explicitly.


        Does **not** create a job or consume any quota.'
      operationId: initialize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestInitializeRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestInitializeResponseDto'
        '400':
          description: Validation error
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Learn about validator and enrichment suggestions
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/initialize-job
  /catchAll/status/{job_id}:
    get:
      tags:
      - Jobs
      summary: Get job status
      description: 'Returns the current pipeline stage and step-level completion flags.


        **Recommended polling interval:** 5 seconds. Stop polling when `status` is
        `completed` or `failed`.


        **Stages in order:** submitted → analyzing → fetching → clustering → enriching
        → completed'
      operationId: getJobStatus
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponseDto'
        '403':
          description: Job does not belong to this user
        '404':
          description: Job not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Understanding job statuses and polling
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/get-job-status
  /catchAll/pull/{job_id}:
    get:
      tags:
      - Jobs
      summary: Pull job results
      description: 'Returns paginated result records for a job.


        You may call this at any pipeline stage — `all_records` will be partially
        populated while the job is still running. Use `page` and `page_size` to paginate
        through results.'
      operationId: getJobResults
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponseDto'
        '403':
          description: Job does not belong to this user
        '404':
          description: Job not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Working with job results and dynamic schemas
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/get-job-results
  /catchAll/pull/{job_id}/csv:
    get:
      tags:
      - Jobs
      summary: Pull job results as CSV
      description: Returns job result records as a CSV download. One row per record
        with enrichment fields as columns and citations as a JSON column. If entity
        datasets were used, connected entities are split into event_associated_entities
        and mention_entities JSON columns; otherwise those columns are omitted.
      operationId: getJobResultsCsv
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: CSV export
          content:
            application/json:
              schema: {}
            text/csv: {}
        '403':
          description: Job does not belong to this user
        '404':
          description: Job not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/jobs/user:
    get:
      tags:
      - Jobs
      summary: List jobs for the authenticated API key
      description: Returns a paginated list of jobs owned by or shared with the caller.
        API key values are masked in the response.
      operationId: getUserJobs
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Page Size
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: ownership
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ownership'
          default: all
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      - name: mode
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProcessingMode'
          - type: 'null'
          description: Filter jobs by processing mode.
          title: Mode
        description: Filter jobs by processing mode.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserJobsResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Learn about job management
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/list-user-jobs
  /catchAll/jobs/{job_id}:
    delete:
      tags:
      - Jobs
      summary: Delete a job
      description: Soft-deletes a job and its associated results.
      operationId: deleteJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteJobResponseDto'
        '403':
          description: Job does not belong to this user
        '404':
          description: Job not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/continue:
    post:
      tags:
      - Jobs
      summary: Continue a job to fetch more results
      description: Use this after reviewing a completed job's results and deciding
        you want more. Increases the job's `limit` and resumes fetching — the existing
        results are kept and new ones are appended. The `Jobs_Concurrency` plan entitlement
        is re-checked; a 429 is returned if it is already exhausted.
      operationId: continueJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinueResponseDto'
        '400':
          description: Validation error or new_limit <= current limit
        '403':
          description: Job does not belong to this user
        '429':
          description: Concurrency limit reached
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Learn about job continuation and limits
        url: https://www.newscatcherapi.com/docs/web-search-api/api-reference/jobs/continue-job
  /catchAll/source-groups:
    get:
      tags:
      - Jobs
      summary: List source groups
      description: 'Returns a paginated list of source groups (named domain allowlists)
        visible to your organization: public groups plus any organization-visibility
        groups your organization has been granted access to. Attach a group''s slug
        to a job via source_groups on POST /submit to scope fetching to its domain
        allowlist. Each entry includes only slug, name, and description.'
      operationId: listSourceGroups
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourceGroupsApiResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/user/limits:
    post:
      tags:
      - Meta
      summary: Get plan limits
      description: Returns plan features and current usage for the authenticated organization.
      operationId: getPlanLimits
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFeaturesResponse'
        '400':
          description: Invalid organization ID or subscription ID format.
        '404':
          description: Subscription or user not found.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/create:
    post:
      tags:
      - Event Monitors
      summary: Create an event monitor
      description: 'Creates a scheduled event monitor from a reference completed job. The
        event monitor re-runs the reference job''s query/validators/enrichments on a cron
        schedule.


        The `Monitor_Active_Slots` plan entitlement is reserved on creation. Use `/disable`
        to pause without losing the slot.


        **Schedule examples:** `''every day at 9 AM''`, `''every Monday at 6 PM EST''`.'
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMonitorResponseDto'
        '400':
          description: Validation error (invalid schedule, timezone, limit, or webhook
            limit exceeded)
        '403':
          description: Invalid or missing API key
        '404':
          description: Reference job or webhook not found
        '422':
          description: Schedule could not be parsed into a cron expression
        '429':
          description: Event monitor active slots limit reached
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/{monitor_id}/status:
    get:
      tags:
      - Event Monitors
      summary: Get event monitor status history
      description: Returns all status entries for an event monitor, ordered newest-first.
        Each entry has a status type, timestamp, and additional_information dict.
      operationId: getMonitorStatusHistory
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorStatusHistoryResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found or no status entries yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/{monitor_id}/jobs:
    get:
      tags:
      - Event Monitors
      summary: List jobs spawned by an event monitor
      description: Returns all jobs created by past event monitor runs, sorted by start_date.
        Each entry includes job_id, start_date, and end_date.
      operationId: listMonitorJobs
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: sort
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          description: Sort by start_date (asc or desc)
          default: asc
          title: Sort
        description: Sort by start_date (asc or desc)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMonitorJobsResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: No jobs found for this event monitor
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/pull/{monitor_id}:
    get:
      tags:
      - Event Monitors
      summary: Pull latest results for an event monitor
      description: Returns the most recent run's aggregated records. Structure mirrors
        job pull with the addition of cron_expression and reference_job.
      operationId: pullMonitorResults
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          title: Monitor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullMonitorResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found or no results yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/pull/{monitor_id}/csv:
    get:
      tags:
      - Event Monitors
      summary: Pull latest event monitor results as CSV
      description: Returns the most recent run's records as a CSV download. One row
        per record with enrichment fields as columns and citations as a JSON column.
        If entity datasets were used, connected entities are split into event_associated_entities
        and mention_entities JSON columns; otherwise those columns are omitted.
      operationId: pullMonitorResultsCsv
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          title: Monitor Id
      responses:
        '200':
          description: CSV export
          content:
            application/json:
              schema: {}
            text/csv: {}
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found or no results yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/{monitor_id}/disable:
    post:
      tags:
      - Event Monitors
      summary: Disable an event monitor
      description: Pauses future runs without deleting the event monitor or releasing the
        entitlement slot.
      operationId: disableMonitor
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableMonitorResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/{monitor_id}/enable:
    post:
      tags:
      - Event Monitors
      summary: Enable (re-activate) an event monitor
      description: 'Re-activates a disabled event monitor. The Monitor_Active_Slots entitlement
        is re-reserved.


        Optional body: `{ "backfill": true }` (default). When backfill=true the first
        run chains forward from the last job''s end date.'
      operationId: enableMonitor
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/EnableMonitorRequestDto'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnableMonitorResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found
        '429':
          description: Event monitor active slots limit reached
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors/{monitor_id}:
    patch:
      tags:
      - Event Monitors
      summary: Update webhook assignments or limit
      description: 'Updates the webhook assignments and/or result limit for an event monitor.
        Pass an empty `webhook_ids: []` to clear all webhook assignments.'
      operationId: updateMonitor
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMonitorResponseDto'
        '400':
          description: Validation error or webhook limit exceeded (max 5 per resource)
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor or webhook not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
      externalDocs:
        description: Learn about event monitor configuration
        url: https://www.newscatcherapi.com/docs/web-search-api/how-to/configure-event-monitors
    delete:
      tags:
      - Event Monitors
      summary: Delete an event monitor
      description: Soft-deletes an event monitor and releases the Monitor_Active_Slots entitlement.
      operationId: deleteMonitor
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMonitorResponseDto'
        '403':
          description: Event monitor does not belong to this user
        '404':
          description: Event monitor not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/monitors:
    get:
      tags:
      - Event Monitors
      summary: List event monitors for the authenticated API key
      description: Returns event monitors owned by or shared with the caller. API key values
        are masked.
      operationId: listMonitors
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Page Size
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: ownership
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ownership'
          default: all
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMonitorsResponseDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or invalid authentication credentials.
  /catchAll/entities:
    post:
      tags:
      - Entities
      summary: Create entity
      description: Creates a single company entity for the organization. Entities
        are the atomic units used in datasets and job targeting. Returns the new entity's
        ID and initial processing status. In addition to name, the entity must include
        at least one of description or additional_attributes.company_attributes.domain.
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequestDto'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
